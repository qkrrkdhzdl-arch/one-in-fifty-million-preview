<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>5천만 분의 1 · One in Fifty Million (Preview)</title>
  <style>
    :root {
      --hanji: #f6f2e8;
      --hanji-deep: #ece5d5;
      --card: #fffdf8;
      --ink: #1e1d1a;
      --ink-soft: #5c574d;
      --ink-faint: #8c8578;
      --line: #dcd4c3;
      --jade: #1f6b45;
      --jade-soft: #eaf3ed;
      --seal: #b5382a;
      --seal-soft: #faeae8;
      --ochre: #b07428;
      --ochre-soft: #fbf3e4;
      --shadow: 0 2px 10px rgba(30, 29, 26, 0.06);
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      background: var(--hanji);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.55;
      font-size: 15px;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: 12px 14px 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 8px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seal-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--seal);
      color: #fff;
      font-weight: 800;
      font-size: 9.5px;
      letter-spacing: -0.6px;
      flex-shrink: 0;
    }
    .brand-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--ink-soft);
    }
    .top-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .pill-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill-btn:hover { background: var(--hanji-deep); }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card-muted {
      background: var(--hanji-deep);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--hanji-deep);
      color: var(--ink-soft);
    }
    .tag.obs { background: var(--jade-soft); color: var(--jade); }
    .tag.prom { background: var(--seal-soft); color: var(--seal); }
    .tag.time { background: var(--ochre-soft); color: var(--ochre); }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: -0.3px;
    }
    h3 {
      margin: 0 0 6px;
      font-size: 14px;
      color: var(--ink-soft);
    }
    p { margin: 0 0 10px; }
    p:last-child { margin-bottom: 0; }

    .mono-stat {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    /* Status panel */
    .status-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }
    .money-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .money-box {
      background: var(--hanji);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
    }
    .money-label {
      font-size: 10px;
      color: var(--ink-faint);
      font-weight: 600;
    }
    .money-val {
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }
    .money-val.debt { color: var(--seal); }
    .obs-lines {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12.5px;
      color: var(--ink-soft);
      border-top: 1px dashed var(--line);
      padding-top: 7px;
    }
    .ledger-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--hanji-deep);
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      width: 100%;
    }
    .ledger-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }
    .ledger-item {
      border-left: 3px solid var(--ink-faint);
      padding: 5px 9px;
      background: var(--hanji);
      border-radius: 0 8px 8px 0;
      font-size: 12px;
    }
    .ledger-item.active { border-left-color: var(--ochre); }
    .ledger-item.kept { border-left-color: var(--jade); }
    .ledger-item.broken { border-left-color: var(--seal); }

    /* Progress */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .step-dot {
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background: var(--line);
    }
    .step-dot.done { background: var(--jade); }
    .step-dot.now { background: var(--seal); }

    /* Choices */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .choice-btn {
      text-align: left;
      background: var(--hanji);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      cursor: pointer;
      transition: transform 0.06s ease, border-color 0.12s ease, background 0.12s ease;
      width: 100%;
      color: var(--ink);
    }
    .choice-btn:hover {
      border-color: var(--ink);
      background: #fff;
    }
    .choice-btn:active { transform: scale(0.99); }
    .choice-title {
      font-weight: 700;
      font-size: 14.5px;
      margin-bottom: 3px;
    }
    .choice-meta {
      font-size: 12px;
      color: var(--ink-soft);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 13px 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .primary-btn.jade { background: var(--jade); }
    .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .secondary-btn {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      padding: 11px 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Allocation controls */
    .alloc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--hanji);
      margin-bottom: 7px;
      gap: 8px;
    }
    .alloc-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .alloc-ctrl button {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    .alloc-num {
      min-width: 34px;
      text-align: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Side note (옆주석) */
    .sidenote {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--jade-soft);
      border: 1px solid #c5dece;
      font-size: 12.5px;
      color: #164e32;
    }
    .ratio-bar {
      margin-top: 10px;
      font-size: 12px;
      color: var(--ink-soft);
      background: var(--hanji);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
    }
    .bar-track {
      display: flex;
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
      background: var(--hanji-deep);
    }

    /* Life map */
    .lifemap-wrap {
      background: #f2ead8;
      border: 1px solid #d4cab4;
      border-radius: 12px;
      padding: 12px;
    }
    canvas.lifemap {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--ink-soft);
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .sw {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    .compare-box {
      border: 1.5px solid var(--jade);
      background: #f5faf7;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      font-size: 13px;
    }
    .disclaimer {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 8px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    const REGION_WEIGHTS = [
      { ko: "경기", en: "Gyeonggi", w: 30.09, traitKo: "신도시 아파트 단지", traitEn: "New-town apartment complex" },
      { ko: "서울", en: "Seoul", w: 18.24, traitKo: "지하철역까지 도보 11분", traitEn: "11-minute walk to subway" },
      { ko: "인천", en: "Incheon", w: 6.60, traitKo: "항구와 공단 사이", traitEn: "Between port and industrial park" },
      { ko: "부산", en: "Busan", w: 5.56, traitKo: "산복도로와 시장 골목", traitEn: "Hillside road and market alley" },
      { ko: "경남", en: "South Gyeongsang", w: 5.47, traitKo: "조선·기계 공단 인근", traitEn: "Near shipyard & machinery complex" },
      { ko: "대구", en: "Daegu", w: 4.32, traitKo: "분지의 여름과 상가", traitEn: "Basin summer & street shops" },
      { ko: "경북", en: "North Gyeongsang", w: 4.16, traitKo: "읍내 버스터미널 근처", traitEn: "Near town bus terminal" },
      { ko: "충남", en: "South Chungcheong", w: 4.08, traitKo: "공장과 논이 섞인 길", traitEn: "Factories beside rice paddies" },
      { ko: "전남", en: "South Jeolla", w: 3.46, traitKo: "막차가 20시 40분인 면", traitEn: "Last bus leaves at 8:40 PM" },
      { ko: "충북", en: "North Chungcheong", w: 3.28, traitKo: "내륙 물류단지 부근", traitEn: "Near inland logistics hub" },
      { ko: "대전", en: "Daejeon", w: 3.07, traitKo: "연구단지와 오래된 빵집", traitEn: "Research district & old bakery" },
      { ko: "전북", en: "North Jeolla", w: 2.81, traitKo: "천변 주택가", traitEn: "Riverside residential block" },
      { ko: "강원", en: "Gangwon", w: 2.67, traitKo: "눈이 잦은 산간 시내", traitEn: "Snowy mountain town" },
      { ko: "광주", en: "Gwangju", w: 2.58, traitKo: "구도심 상가 2층", traitEn: "Second floor in old downtown" },
      { ko: "울산", en: "Ulsan", w: 2.22, traitKo: "석유화학·자동차 사택", traitEn: "Petrochemical & auto housing" },
      { ko: "제주", en: "Jeju", w: 1.29, traitKo: "지하철 대신 배 시간표", traitEn: "Ferry schedules instead of subways" },
      { ko: "세종", en: "Sejong", w: 1.17, traitKo: "정부청사 인근 단지", traitEn: "Complex near government ministries" }
    ];

    const COHORTS = [
      { year: 1981, births: "867,409", imfAge: 17, labelKo: "1981년생", labelEn: "Born 1981", noteKo: "1997년 IMF 때 고1. 대학 등록금과 첫 취업이 외환위기 직후와 겹친 세대.", noteEn: "Age 16 during the 1997 IMF crisis. Entering adulthood in the aftermath." },
      { year: 1990, births: "649,738", imfAge: 8, labelKo: "1990년생", labelEn: "Born 1990", noteKo: "2008년 금융위기 때 고3. 청년 전세난과 대출 규제를 정면으로 맞은 세대.", noteEn: "Age 18 during the 2008 crisis. Facing steep jeonse deposits in their late 20s." },
      { year: 1998, births: "641,594", imfAge: 0, labelKo: "1998년생", labelEn: "Born 1998", noteKo: "IMF의 해에 태어난 세대. 전세 보증금 2억 시대에 20대 후반을 보낸다.", noteEn: "Born the year of the IMF bailout. Navigating a ₩200M deposit market in their 20s." }
    ];

    const TEMPERS = [
      { ko: "흙과 돌을 오래 들여다본다", en: "Watches dirt and pebbles for a long time" },
      { ko: "있는 힘껏 달려 나간다", en: "Runs ahead as hard as possible" },
      { ko: "우는 아이에게 다가간다", en: "Walks over to a crying child" },
      { ko: "넘어져도 혼자 일어난다", en: "Gets back up alone after falling" }
    ];

    const ITEMS = [
      { ko: "어머니의 낡은 통장", en: "Mother's worn bankbook" },
      { ko: "아버지의 작업복 명찰", en: "Father's coverall name tag" },
      { ko: "첫 알바로 산 운동화", en: "Sneakers from first part-time job" }
    ];

    let state = {
      lang: "ko",
      screen: "cover", // cover | step | feedback | ending
      ledgerOpen: false,
      compareOpen: false,
      life: null,
      stepIdx: 0,
      lastResult: null,
      alloc: { study: 4, work: 4, club: 2, sibling: 2 }
    };

    function pickWeightedRegion() {
      const total = REGION_WEIGHTS.reduce((s, r) => s + r.w, 0);
      let roll = Math.random() * total;
      for (const r of REGION_WEIGHTS) {
        roll -= r.w;
        if (roll <= 0) return r;
      }
      return REGION_WEIGHTS[0];
    }

    function newLife(forcedCohortIdx) {
      const region = pickWeightedRegion();
      const cohort = forcedCohortIdx !== undefined ? COHORTS[forcedCohortIdx] : COHORTS[Math.floor(Math.random() * COHORTS.length)];
      const gender = Math.random() < 0.51 ? "M" : "F";
      const familyRoll = Math.random();
      const family = familyRoll < 0.45 ? "wage" : familyRoll < 0.78 ? "shop" : "office";
      const temper = TEMPERS[Math.floor(Math.random() * TEMPERS.length)];
      const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
      const startCash = family === "office" ? 1800 : family === "wage" ? 650 : 400; // 만원
      state.life = {
        region,
        cohort,
        gender,
        family,
        temper,
        item,
        cash: startCash, // 만원
        debt: family === "shop" ? 1200 : 0, // 만원
        monthlyOut: 42, // 만원
        monthlyIncome: 245, // 만원 (adult baseline)
        mindScore: 68, // internal only, never shown as number
        bodyScore: 76,
        ledger: [],
        history: [],
        siblingTrust: 1,
        jeonseSigned: false,
        jeonseLoan: 0,
        parentLoan: 0,
        skippedTime: [],
        altSupportGranted: false,
        _short: 0
      };
      state.stepIdx = 0;
      state.lastResult = null;
      state.ledgerOpen = false;
      state.compareOpen = false;
      state.alloc = { study: 4, work: 4, club: 2, sibling: 2 };
    }

    function fmtMan(v, lang) {
      const ko = (lang || state.lang) === "ko";
      if (v === 0) return ko ? "0원" : "₩0";
      const abs = Math.abs(v);
      const sign = v < 0 ? "-" : "";
      if (abs >= 10000) {
        const eok = Math.floor(abs / 10000);
        const rem = abs % 10000;
        if (ko) return sign + eok + "억" + (rem ? " " + rem.toLocaleString() + "만 원" : " 원");
        return sign + "₩" + (abs * 10000).toLocaleString();
      }
      return ko ? sign + abs.toLocaleString() + "만 원" : sign + "₩" + (abs * 10000).toLocaleString();
    }

    // 현금이 모자라면 부족분을 마이너스 통장(빚)으로 넘긴다. 통장이 음수로 찍히지 않게 한다.
    function spend(life, amount) {
      if (life.cash >= amount) { life.cash -= amount; return; }
      const short = amount - Math.max(0, life.cash);
      life.cash = 0;
      life.debt += short;
      life._short = (life._short || 0) + short;
    }

    function bodySentence() {
      const s = state.life.bodyScore;
      if (state.lang === "ko") {
        if (s >= 72) return "몸: 계단을 두 칸씩 올라도 숨이 차지 않는다.";
        if (s >= 55) return "몸: 야근 다음 날 어깨가 쉽게 굳는다.";
        return "몸: 병원 예약 문자를 두 달째 미루고 있다.";
      }
      if (s >= 72) return "Body: Takes two stairs at a time without losing breath.";
      if (s >= 55) return "Body: Shoulders stiffen easily after late shifts.";
      return "Body: Has postponed a clinic checkup text for two months.";
    }

    function mindSentence() {
      const s = state.life.mindScore;
      if (state.lang === "ko") {
        if (s >= 68) return "마음: 불을 끄면 15분 안에 잠든다.";
        if (s >= 50) return "마음: 요즘 잠들기까지 한 시간이 넘는다.";
        return "마음: 휴대폰 진동만 울려도 통장 잔고부터 떠올린다.";
      }
      if (s >= 68) return "Mind: Falls asleep within fifteen minutes of turning off the light.";
      if (s >= 50) return "Mind: Takes over an hour to fall asleep these days.";
      return "Mind: Checks the bank balance mentally whenever the phone buzzes.";
    }

    function getSteps() {
      const L = state.life;
      const y14 = L.cohort.year + 14;
      const y19 = L.cohort.year + 19;
      const y24 = L.cohort.year + 24;
      const y29 = L.cohort.year + 29;
      const y34 = L.cohort.year + 34;
      const y45 = L.cohort.year + 45;

      return [
        {
          id: "age14",
          type: "alloc",
          age: 14,
          year: y14,
          badgeKo: "배분 · 시간 12시간",
          badgeEn: "Allocation · 12 Hours",
          titleKo: `${y14}년 · 14세, ${L.region.ko}`,
          titleEn: `${y14} · Age 14, ${L.region.en}`,
          bodyKo: `중학교 2학년. 방과 후 쓸 수 있는 자유 시간이 주당 12시간 남았다. 무엇을 줄이든 이름은 남는다.`,
          bodyEn: `Eighth grade. You have 12 free hours a week after school. Whatever gets pushed aside will return by name later.`,
          sidenoteKo: "시간 배분은 한 생애에 세 번뿐이다. 밀린 칸이 5년 뒤 장면으로 돌아온다.",
          sidenoteEn: "Time is allocated only three times in a life. What you skip returns five years later."
        },
        {
          id: "age19",
          type: "choice",
          age: 19,
          year: y19,
          badgeKo: "약속 · 첫 서명",
          badgeEn: "Promise · First Signature",
          titleKo: `${y19}년 · 19세, 첫 갈림길`,
          titleEn: `${y19} · Age 19, First Fork`,
          bodyKo: L.gender === "M"
            ? `병역 통지서가 식탁 위에 놓였다. 공책에 육군 18개월과 산업기능요원 34개월, 그리고 야간대학 등록금 240만 원을 나란히 적었다.`

    function drawLifeMap() {
      const canvas = document.getElementById("lifemapCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const L = state.life;
      ctx.fillStyle = "#f2ead8";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 5 acts x 15 years = 75 cells (15 cols x 5 rows)
      const cols = 15, rows = 5;
      const padX = 16, padY = 18;
      const gap = 5;
      const cellW = Math.floor((canvas.width - padX * 2 - gap * (cols - 1)) / cols);
      const cellH = Math.floor((canvas.height - padY * 2 - gap * (rows - 1)) / rows);

      const brokenCnt = L.ledger.filter(x => x.status === "broken").length;
      const keptCnt = L.ledger.filter(x => x.status === "kept").length;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const age = r * cols + c;
          const x = padX + c * (cellW + gap);
          const y = padY + r * (cellH + gap);

          let color = "#2d2a24";
          if (age === 14 || age === 19 || age === 29) {
            color = "#1f6b45";
          } else if (age === 24 || (age >= 30 && age <= 34 && L.debt > 5000)) {
            color = "#b07428";
          } else if ((age === 34 || age === 45) && brokenCnt > 0) {
            color = "#b5382a";
          } else if (age > 45) {
            color = keptCnt >= 2 && L.mindScore >= 55 ? "#1f6b45" : (L.debt > 8000 ? "#b07428" : "#6b6559");
          } else if ((age * 7 + L.cohort.year) % 5 === 0) {
            color = "#6b6559";
          }

          ctx.fillStyle = color;
          ctx.fillRect(x, y, cellW, cellH);

          if ([0, 14, 19, 24, 29, 34, 45, 70].includes(age)) {
            ctx.strokeStyle = "#fffdf8";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + 1, y + 1, cellW - 2, cellH - 2);
          }
        }
      }
    }

    function render() {
      const ko = state.lang === "ko";
      const app = document.getElementById("app");
      let body = "";
      if (state.screen === "cover") body = renderCover();
      else if (state.screen === "step") body = renderStep();
      else if (state.screen === "feedback") body = renderFeedback();
      else body = renderEnding();

      app.innerHTML = `
        <div class="topbar">
          <div class="brand">
            <div class="seal-badge">1/50M</div>
            <div>
              <div class="brand-title">${ko ? "5천만 분의 1" : "One in Fifty Million"}</div>
              <div class="brand-sub">${ko ? "기획서 미리보기 체험판" : "Design Doc Interactive Preview"}</div>
            </div>
          </div>
          <div class="top-actions">
            <button class="pill-btn" onclick="toggleLang()">${ko ? "EN" : "한국어"}</button>
            <button class="pill-btn" onclick="rerollBirth()">${ko ? "새 삶" : "Reset"}</button>
          </div>
        </div>
        ${body}
      `;

      if (state.screen === "ending") {
        requestAnimationFrame(drawLifeMap);
      }
    }

    // Actions
    window.toggleLang = () => {
      state.lang = state.lang === "ko" ? "en" : "ko";
      document.documentElement.lang = state.lang;
      render();
    };
    window.toggleLedger = () => {
      state.ledgerOpen = !state.ledgerOpen;
      render();
    };
    window.toggleCompare = () => {
      state.compareOpen = !state.compareOpen;
      render();
    };
    window.rerollBirth = () => {
      newLife();
      state.screen = "cover";
      render();
    };
    window.startGame = () => {
      state.screen = "step";
      render();
    };
    window.chgAlloc = (key, delta) => {
      const nxt = state.alloc[key] + delta;
      if (nxt < 0 || nxt > 12) return;
      const a = state.alloc;
      const used = a.study + a.work + a.club + a.sibling;
      if (delta > 0 && used >= 12) return; // 12시간을 넘길 수 없다
      state.alloc[key] = nxt;
      render();
    };
    window.submitAlloc = () => {
      const L = state.life;
      const a = state.alloc;
      if (a.work >= 4) L.cash += 220;
      if (a.sibling >= 2) L.siblingTrust += 1;
      if (a.study < 2) L.skippedTime.push(state.lang === "ko" ? "학원" : "Cram school");
      if (a.club < 1) L.skippedTime.push(state.lang === "ko" ? "친구" : "Friends");
      if (a.sibling < 1) L.skippedTime.push(state.lang === "ko" ? "동생" : "Sibling");

      const step = getSteps()[0];
      state.lastResult = {
        titleKo: "14세의 시간표가 확정되었다",
        titleEn: "Your Age-14 Schedule Is Set",
        summaryKo: `학원 ${a.study}시간 · 알바 ${a.work}시간 · 동아리 ${a.club}시간 · 동생 ${a.sibling}시간. ${a.sibling >= 2 ? "동생과의 약속이 장부에 좋은 기억으로 남았다." : "비워 둔 시간은 몇 년 뒤 다른 자리에서 이름으로 불린다."}`,
        summaryEn: `Study ${a.study}h · Work ${a.work}h · Club ${a.club}h · Sibling ${a.sibling}h. ${a.sibling >= 2 ? "Time with your sibling builds quiet trust." : "What you skipped will resurface later by name."}`,
        sidenoteKo: step.sidenoteKo,
        sidenoteEn: step.sidenoteEn,
        ratios: null
      };
      state.screen = "feedback";
      render();
    };
    window.pickChoice = (idx) => {
      const step = getSteps()[state.stepIdx];
      const c = step.choices[idx];
      const L = state.life;
      L._short = 0;
      c.apply(L);
      const shortKo = L._short > 0 ? ` 현금이 모자란 ${fmtMan(L._short, "ko")}은 마이너스 통장으로 넘어갔다.` : "";
      const shortEn = L._short > 0 ? ` The shortfall of ${fmtMan(L._short, "en")} went onto an overdraft.` : "";
      state.lastResult = {
        titleKo: c.titleKo,
        titleEn: c.titleEn,
        summaryKo: c.metaKo + shortKo,
        summaryEn: c.metaEn + shortEn,
        sidenoteKo: c.sidenoteKo,
        sidenoteEn: c.sidenoteEn,
        ratios: c.ratios
      };
      state.screen = "feedback";
      render();
    };
    window.nextStep = () => {
      const steps = getSteps();
      if (state.stepIdx < steps.length - 1) {
        state.stepIdx += 1;
        state.screen = "step";
      } else {
        state.screen = "ending";
      }
      render();
    };

    newLife();
    render();
  </script>
</body>
</html>
