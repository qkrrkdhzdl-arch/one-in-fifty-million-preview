<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>검수 — 390×844</title>
<style>
  html,body{margin:0;background:#DDE5E1;font-family:system-ui,sans-serif}
  .bar{display:flex;gap:12px;align-items:center;padding:10px 16px;font:600 13px "IBM Plex Mono",monospace;color:#13212A}
  .wrap{padding:0 16px 24px}
  iframe{width:390px;height:844px;border:1px solid #B9C6C1;border-radius:10px;background:#EBF0ED;display:block}
</style>
</head>
<body>
<div class="bar"><span>390 × 844 · iPhone 14 Pro</span><span id="st"></span></div>
<div class="wrap"><iframe id="ph" title="mobile preview"></iframe></div>
<script>
  const f = document.getElementById('ph');
  // 검수할 때마다 최신 배포본을 새로 받는다(브라우저 캐시 회피)
  f.src = '../index.html?_=' + Date.now();
  f.addEventListener('load', () => {
    try {
      const w = f.contentWindow;
      document.getElementById('st').textContent = 'errs: ' + JSON.stringify((w.__errs || []).slice(0, 3));
    } catch (e) { document.getElementById('st').textContent = 'cross-origin'; }
  });
</script>
</body>
</html>
