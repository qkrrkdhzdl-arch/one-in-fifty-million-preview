<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>카드 검수 · 5천만 분의 1</title>
<style>
  body{margin:0;background:#2a2824;color:#d8cfbc;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
  .wrap{display:flex;gap:28px;padding:24px;justify-content:center;flex-wrap:wrap}
  .col{width:360px}
  .col h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8d8474;font-weight:600;margin:0 0 8px}
  canvas{width:100%;height:auto;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.45);background:#f4efe3;display:block}
  button{margin-top:10px;padding:10px 14px;border-radius:8px;border:0;background:#b23a2b;color:#fff;font-weight:700;width:100%}
  .note{padding:0 24px 24px;color:#8d8474;font-size:12px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="col"><h2>4:5 · 1080×1350</h2><canvas id="c45"></canvas><button id="d45">4:5 PNG 저장</button></div>
  <div class="col"><h2>9:16 · 1080×1920</h2><canvas id="c916"></canvas><button id="d916">9:16 PNG 저장</button></div>
</div>
<p class="note" id="note"></p>
<script src="../js/content.js?v=1126i"></script>
<script src="../js/util.js?v=1126i"></script>
<script src="../js/engine.js?v=1126i"></script>
<script src="../js/charts.js?v=1126i"></script>
<script src="../js/share.js?v=1126i"></script>
<script>
window.APP = { lang: new URLSearchParams(location.search).get("lang") || "ko" };
document.documentElement.lang = APP.lang;
const seed = +(new URLSearchParams(location.search).get("seed") || 63352);
const life = window.ENGINE.createLife({ seed });
let guard = 0;
while (!life.death && guard++ < 120) {
  const r = window.ENGINE.tick(life);
  if (r.decision) window.ENGINE.applyChoice(life, r.decision, r.decision.ch[Math.floor(Math.random() * r.decision.ch.length)]);
  if (r.reflection) life.pendingReflection = false;
}
life.reflections.push({ age: 30, text: "나는 그때 부산에서 첫 회사를 다니고 있었다. 야근이 끝나면 자전거로 집까지 갔다." });
window.SHARE.drawCard(life, "45", document.getElementById("c45"));
window.SHARE.drawCard(life, "916", document.getElementById("c916"));
document.getElementById("note").textContent =
  `${life.name.ko} · ${life.birthYear}—${life.year} · ${life.death.age}세 · ${life.death.cause} · 순자산 ${Math.round(window.ENGINE.netWorth(life) / 100) / 100}억`;
function dl(id, name) {
  document.getElementById(id).onclick = () => {
    const cv = name === "45" ? document.getElementById("c45") : document.getElementById("c916");
    cv.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = `1in50m_${name}_${life.name.en.replace(/\s+/g, "")}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }, "image/png");
  };
}
dl("d45", "45"); dl("d916", "916");
</script>
</body>
</html>
